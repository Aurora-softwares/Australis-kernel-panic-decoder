<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#121821" />
    <meta name="description" content="Scan an Australis OS panic QR code, understand the crash, and check public GitHub issues without uploading your diagnostics." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>Australis Diagnostics — Understand a crash</title>
    <script>
      try {
        var savedTheme = localStorage.getItem('australis-theme');
        if (['auto', 'light', 'dark'].includes(savedTheme)) document.documentElement.dataset.theme = savedTheme;
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
