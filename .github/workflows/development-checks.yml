name: Development checks (no deployment)

on:
  push:
    branches: [Development]
  pull_request:
    branches: [Release]

permissions:
  contents: read

jobs:
  validate:
    # Keep fork pull requests off the self-hosted Cerberus machine.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || '["self-hosted","Linux","X64"]') }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Check production build
        run: npm run build
